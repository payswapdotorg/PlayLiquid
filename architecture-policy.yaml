global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions:
  - rule: max-file-lines
    expires: 2026-11-30
    paths:
      - packages/platform-economy/src/service.ts
      - packages/tool-fabric/src/call-protocol.ts
      - packages/lab-contracts/src/organization.ts
      - packages/lab-contracts/src/loop.ts
      - packages/package-registry/src/cas-binding.ts
      - packages/package-registry/src/registry-index.test.ts
      - packages/package-registry/src/cas-binding.test.ts
      - packages/sensory-runtime/src/runtime.negative.test.ts
      - packages/artifact-store/src/store.test.ts
      - packages/artifact-store/src/store.ts
      - packages/git-lineage/src/overlay.ts
      - packages/git-lineage/src/validate-lineage.ts
      - packages/runtime-core/src/negative.test.ts
      - packages/runtime-core/src/kernel.test.ts
      - packages/runtime-core/src/kernel.ts
      - packages/simulation/src/session.ts
      - packages/platform-multiplayer/src/outcomes.ts
      - packages/platform-multiplayer/src/kernel.test.ts
      - packages/game-ui/src/fixtures/demo.ts
      - packages/build-orchestrator/src/service.test.ts
      - packages/build-orchestrator/src/service.ts
  # PL-043 (browser journeys): the three qa/browser ui-adapters re-export
  # ONLY symbols the web packages' public entrypoints also export, but they
  # must reach them through src/ files because game-ui/gameos-lab/
  # gameos-community index.ts re-exports .tsx components and plain
  # `node --test` cannot load .tsx (ERR_UNKNOWN_FILE_EXTENSION). The
  # deep-import targets are the .ts implementation files behind those
  # entrypoints, never private helpers. Expires when the web packages
  # split their entrypoints so plain-node hosts can consume them.
  - rule: deep-import
    expires: 2026-11-30
    paths:
      - qa/browser/src/studio-ui.ts
      - qa/browser/src/lab-ui.ts
      - qa/browser/src/community-ui.ts
  # RW-001 (desktop product shell): the desktop host adapter test mounts the
  # three module stores (the PL-033 mount recipe) in plain `node --test`;
  # same .tsx-entrypoint constraint as PL-043 — the deep-import targets are
  # the .ts implementation files behind the public entrypoints, never
  # private helpers. TL-authorized (RW-004 surface). Expires when the web
  # packages split their entrypoints so plain-node hosts can consume them.
  - rule: deep-import
    expires: 2026-11-30
    paths:
      - packages/desktop/src/renderer/src/gameos/host/desktop-host.test.ts
  - id: gen-ui-tweak-runtime-size
    rule: max-file-lines
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Keep parameter binding and registration lifecycle together; runtime-manifest.json and tests verify file integrity.
  - id: gen-ui-tweak-runtime-lint
    rule: disable-count
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Allow the control-character validation regex and the single-file parameter-control runtime.
