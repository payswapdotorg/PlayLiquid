name: PlayLiquid Desktop Release

# RW-004 (TL-owned): build the PlayLiquid GameOS desktop artifacts for
# Linux (Ubuntu-targeted AppImage + .deb) reproducibly from an approved,
# pinned commit, run the RW-003 packaged-app smoke harness on ubuntu-latest
# (true Ubuntu launch evidence), and — when publish_release is set — publish
# the GitHub Release (tag pinned to the built SHA, AppImage + .deb +
# SHA256SUMS + smoke evidence) and re-verify the published asset by
# download + checksum + launch.

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Commit SHA / branch / tag to build (defaults to the ref this run was dispatched on)"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release from the built artifacts"
        type: boolean
        required: false
        default: false
      tag_name:
        description: "Release tag (created at the built SHA), e.g. playliquid-gameos-v3.14.3"
        required: false
        default: ""
      release_name:
        description: "Release title, e.g. PlayLiquid GameOS 3.14.3 (Linux)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Determine build ref
        id: ref
        run: |
          REF="${{ github.event.inputs.build_ref }}"
          if [ -z "$REF" ]; then REF="${{ github.sha }}"; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "building $REF"

      - name: Check out pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          # bsdtar (libarchive-tools) is required by electron-builder's fpm
          # for the pacman target (live-caught 2026-10-14: exit 127 on run
          # 38623571228 — ubuntu-latest runners ship without it)
          # xvfb is required by the RW-003 smoke harness (window-level
          # evidence: the packaged app runs under a real display server).
          # libfuse2: real Ubuntu desktops ship FUSE2 so AppImages run in
          # their normal FUSE mode; the runner mirrors that (live-caught:
          # run 38678556303 — /dev/fuse present but libfuse2 absent made the
          # AppImage fall back to --appimage-extract-and-run).
          sudo apt-get install -y libarchive-tools rpm xvfb libfuse2

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm --filter @zcode/desktop run build

      - name: Bundle Linux artifacts (AppImage + deb)
        run: pnpm --filter @zcode/desktop exec pnpm run bundle -- --os linux --arch x64
        env:
          ZCODE_ENV: production

      - name: Collect artifacts
        run: |
          mkdir -p release-out
          ls -la packages/desktop/dist/ || true
          # AppImage + deb are the Ubuntu-supported artifacts (RW-002)
          cp packages/desktop/dist/*.AppImage release-out/ 2>/dev/null || true
          cp packages/desktop/dist/*.deb release-out/ 2>/dev/null || true
          if ! ls release-out/*.AppImage >/dev/null 2>&1; then
            echo "ERROR: no AppImage produced"; exit 1
          fi
          if ! ls release-out/*.deb >/dev/null 2>&1; then
            echo "ERROR: no .deb produced"; exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release-out
          sha256sum *.AppImage *.deb > SHA256SUMS
          cat SHA256SUMS

      # ------------------------------------------------------------------
      # RW-003 smoke harness on ubuntu-latest — the true-Ubuntu launch
      # evidence (station runs are Debian 13, honestly labeled as such).
      # Two REAL user flows, both gated (any unexpected check fails the
      # release):
      #   1. the .deb INSTALL path (recommended on Ubuntu 24.04: the postinst
      #      installs the app's AppArmor profile and the SUID fallback —
      #      live-caught on run 38681143022: stock 24.04 restricts
      #      unprivileged user namespaces and the AppImage's FUSE mount
      #      cannot be SUID, so Chromium aborts with SIGTRAP);
      #   2. the AppImage with the userns sysctl relaxed — the documented
      #      power-user path on 24.04 (the AppImage runs fully sandboxed
      #      wherever unprivileged userns are allowed, e.g. Debian and
      #      Ubuntu <= 23.10).
      # ------------------------------------------------------------------
      - name: Run packaged-app smoke harness (Ubuntu)
        run: |
          set -euo pipefail
          APPIMAGE="$(ls release-out/*.AppImage)"
          DEB="$(ls release-out/*.deb)"

          # --- Flow 1: the .deb install path (the recommended Ubuntu flow) ---
          sudo apt-get install -y "./$DEB"
          INSTALLED="$(command -v playliquid-gameos)"
          echo "installed binary: $INSTALLED"
          bash qa/desktop-release/scripts/run-ubuntu.sh "$INSTALLED" "$PWD/$DEB"

          # --- Flow 2: the AppImage with the documented 24.04 sysctl ---
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "NOTE: kernel.apparmor_restrict_unprivileged_userns not present on this kernel — running the AppImage as-is"
          fi
          bash qa/desktop-release/scripts/run-ubuntu.sh "$PWD/$APPIMAGE" "$PWD/$DEB"

      - name: Collect smoke evidence
        if: ${{ always() }}
        run: |
          EVID_DIR="$(ls -dt qa/desktop-release/evidence/ubuntu-* | head -1)"
          echo "evidence dir: $EVID_DIR"
          cat "$EVID_DIR"/report.json || true
          # keep the harness evidence out of the release assets but upload
          # it as a workflow artifact for the release notes / verification
          mkdir -p smoke-evidence
          cp -r qa/desktop-release/evidence/ubuntu-* smoke-evidence/
          cp release-out/SHA256SUMS smoke-evidence/

      - name: Upload smoke evidence (workflow run)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playliquid-gameos-smoke-evidence
          path: smoke-evidence/
          if-no-files-found: warn

      - name: Upload artifacts (workflow run)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playliquid-gameos-linux-amd64
          path: release-out/
          if-no-files-found: error

      - name: Compute release metadata
        id: meta
        run: |
          APPIMAGE="$(cd release-out && ls *.AppImage)"
          DEB="$(cd release-out && ls *.deb)"
          SHA_APPIMAGE="$(cd release-out && sha256sum "$APPIMAGE" | cut -d' ' -f1)"
          SHA_DEB="$(cd release-out && sha256sum "$DEB" | cut -d' ' -f1)"
          VERSION="$(echo "$APPIMAGE" | sed -E 's/.*-([0-9][^-]*)-linux-.*/\1/')"
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then TAG="playliquid-gameos-v${VERSION}"; fi
          NAME="${{ github.event.inputs.release_name }}"
          if [ -z "$NAME" ]; then NAME="PlayLiquid GameOS ${VERSION} (Linux)"; fi
          {
            echo "appimage=$APPIMAGE"
            echo "deb=$DEB"
            echo "sha_appimage=$SHA_APPIMAGE"
            echo "sha_deb=$SHA_DEB"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG name=$NAME appimage=$APPIMAGE deb=$DEB"

      # ------------------------------------------------------------------
      # Publication: tag pinned to the built SHA + Release with honest
      # notes, assets, checksums. Skipped unless publish_release is set.
      # ------------------------------------------------------------------
      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.name }}"
          APPIMAGE="${{ steps.meta.outputs.appimage }}"
          DEB="${{ steps.meta.outputs.deb }}"
          SHA_APPIMAGE="${{ steps.meta.outputs.sha_appimage }}"
          SHA_DEB="${{ steps.meta.outputs.sha_deb }}"
          BUILD_SHA="$(git rev-parse HEAD)"

          cat > release-notes.md <<NOTES
          # ${NAME}

          PlayLiquid GameOS desktop application for Ubuntu Linux (x64).

          - **Built from:** \`${BUILD_SHA}\` (tag: \`${TAG}\`)
          - **Assets:** \`${APPIMAGE}\`, \`${DEB}\`, \`SHA256SUMS\`
          - **SHA-256 (AppImage):** \`${SHA_APPIMAGE}\`
          - **SHA-256 (deb):** \`${SHA_DEB}\`

          ## Install

          .deb (recommended on Ubuntu 24.04 — the package postinst installs the
          app's AppArmor profile and the sandbox fallback the OS requires):

          \`\`\`bash
          sudo apt-get install -y ./${DEB}
          \`\`\`

          AppImage (no installation; runs as-is on Debian, Ubuntu <= 23.10 and
          other distributions that allow unprivileged user namespaces. On
          Ubuntu 24.04's default restriction, either prefer the .deb above or
          enable the namespace path once):

          \`\`\`bash
          chmod +x ${APPIMAGE}
          ./${APPIMAGE}
          # Ubuntu 24.04 AppImage path (one-time, then launch normally):
          # sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          \`\`\`

          System requirements (observed on ubuntu-latest / Ubuntu 24.04):
          libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils,
          libatspi2.0-0, libuuid1, libsecret-1-0.

          ## Verify

          \`\`\`bash
          sha256sum --ignore-missing -c SHA256SUMS
          \`\`\`

          ## Evidence

          The packaged application was smoke-tested on ubuntu-latest
          (startup, clean shutdown, PlayLiquid product shell rendering,
          Studio/Lab/Community navigation, product identity, first-run
          states, dual viewports 390x844 + 1280x800, offline error
          handling) — see the linked workflow run for the full harness
          transcript, screenshots and logs.
          NOTES

          # Tag-collision policy (issue #9): a release tag may only ever
          # point at the exact commit its artifacts were built and tested
          # from. If the tag already exists at a DIFFERENT commit, refuse —
          # never silently overwrite a release built from another SHA.
          # (Same-SHA re-runs remain idempotent: re-upload + checksum verify.)
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$EXISTING_SHA" != "$BUILD_SHA" ]; then
              echo "ERROR: tag $TAG already exists at $EXISTING_SHA, but this run built and tested $BUILD_SHA — refusing to overwrite a release built from another SHA"
              exit 1
            fi
            echo "tag $TAG already exists at the built SHA ($BUILD_SHA) — refreshing its assets"
          fi

          # Create (or reuse) the release — the tag is created at the built SHA.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists (tag verified at the built SHA above) — assets will be refreshed"
          else
            gh release create "$TAG" \
              --target "$BUILD_SHA" \
              --title "$NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" \
            "release-out/${APPIMAGE}" "release-out/${DEB}" "release-out/SHA256SUMS" \
            --clobber
          gh release view "$TAG"

      # ------------------------------------------------------------------
      # Post-publication verification: download the PUBLISHED asset by its
      # release URL, checksum it, and launch it (DoD: the published file —
      # not the local build — boots as PlayLiquid GameOS).
      # ------------------------------------------------------------------
      - name: Verify published asset (download + checksum + launch)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          APPIMAGE="${{ steps.meta.outputs.appimage }}"
          DEB="${{ steps.meta.outputs.deb }}"
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APPIMAGE" --pattern "$DEB" --pattern "SHA256SUMS"
          sha256sum -c SHA256SUMS
          # The PUBLISHED .deb install path (recommended Ubuntu flow — the
          # postinst AppArmor profile / SUID fallback makes it work on stock
          # 24.04 where the AppImage needs the userns sysctl):
          sudo apt-get install -y "./$DEB"
          INSTALLED="$(command -v playliquid-gameos)"
          echo "published-installed binary: $INSTALLED"
          bash ../qa/desktop-release/scripts/run-ubuntu.sh "$INSTALLED" "$(pwd)/$DEB"
